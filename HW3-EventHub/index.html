
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Event Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Resilient Event Hub</h1>
        <p>Register for our upcoming technology event!</p>
    </header>

    <main>
        <section aria-labelledby="countdown-title">
            <h2 id="countdown-title">Event Countdown</h2>

            <p id="countdown" role="timer">
                Loading countdown...
            </p>
        </section>

        <section aria-labelledby="registration-title">
            <h2 id="registration-title">Event Registration</h2>

            <form id="registration-form">
                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <button type="submit" id="submit-btn">
                    Register
                </button>
            </form>

            <p id="form-status" role="status" aria-live="polite">
                Ready to register.
            </p>
        </section>
    </main>

    <footer>
        <p>HW3 - Web Application Development</p>
    </footer>
</body>
</html>
