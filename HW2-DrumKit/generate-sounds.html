
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Drum Sounds</title>
</head>
<body>
  <h1>Generate Drum Sounds</h1>
  <button id="generate">Download 4 WAV Files</button>
  <p id="status">Ready</p>

  <script>
    const sampleRate = 44100;

    function makeSound(type) {
      const duration = {
        kick: 0.5,
        snare: 0.3,
        hihat: 0.15,
        clap: 0.3
      }[type];

      const count = Math.floor(duration * sampleRate);
      const samples = new Float32Array(count);

      let phase = 0;

      for (let i = 0; i < count; i++) {
        const t = i / sampleRate;
        const noise = Math.random() * 2 - 1;
        let value = 0;

        if (type === "kick") {
          const freq = 50 + 120 * Math.exp(-t * 30);
          phase += 2 * Math.PI * freq / sampleRate;
          value = Math.sin(phase) * Math.exp(-t * 12);
        }

        if (type === "snare") {
          value = (
            noise * 0.8 +
            Math.sin(2 * Math.PI * 180 * t) * 0.2
          ) * Math.exp(-t * 18);
        }

        if (type === "hihat") {
          value = noise * Math.exp(-t * 45);
        }

        if (type === "clap") {
          const burst =
            Math.exp(-t * 30) *
            (0.5 + 0.5 * Math.cos(2 * Math.PI * 35 * t));
          value = noise * burst;
        }

        samples[i] = Math.max(-1, Math.min(1, value));
      }

      return samples;
    }

    function toWav(samples) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, str) {
        for (let i = 0; i < str.length; i++) {
          view.setUint8(offset + i, str.charCodeAt(i));
        }
      }

      writeString(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, samples.length * 2, true);

      for (let i = 0; i < samples.length; i++) {
        view.setInt16(
          44 + i * 2,
          Math.round(samples[i] * 32767),
          true
        );
      }

      return new Blob([buffer], { type: "audio/wav" });
    }

    document.getElementById("generate").onclick = () => {
      const sounds = ["kick", "snare", "hihat", "clap"];

      sounds.forEach((name, index) => {
        setTimeout(() => {
          const blob = toWav(makeSound(name));
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = name + ".wav";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 10000);
        }, index * 500);
      });

      document.getElementById("status").textContent =
        "Generating 4 WAV files...";
    };
  </script>
</body>
</html>
