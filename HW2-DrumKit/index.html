
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Drum Kit Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Drum Kit Engine</h1>
    <p>Press the keys to play drum sounds!</p>
  </header>

  <main>
    <section aria-labelledby="drum-title">
      <h2 id="drum-title">Drum Pads</h2>

      <section class="drum-kit" aria-label="Drum controls">
        <button class="drum-pad"
                type="button"
                data-key="a"
                data-sound="sounds/kick.wav">
          A - Kick
        </button>

        <button class="drum-pad"
                type="button"
                data-key="s"
                data-sound="sounds/snare.wav">
          S - Snare
        </button>

        <button class="drum-pad"
                type="button"
                data-key="d"
                data-sound="sounds/hihat.wav">
          D - Hi-Hat
        </button>

        <button class="drum-pad"
                type="button"
                data-key="f"
                data-sound="sounds/clap.wav">
          F - Clap
        </button>
      </section>
    </section>

    <section aria-labelledby="recorder-title">
      <h2 id="recorder-title">Beat Recorder</h2>
      <button id="record-btn" type="button">Record</button>
      <button id="replay-btn" type="button">Replay</button>
      <button id="clear-btn" type="button">Clear</button>
      <p id="record-status" role="status">Ready to record</p>
    </section>
  </main>

  <script src="drum-kit.js" defer></script>
</body>
</html>
